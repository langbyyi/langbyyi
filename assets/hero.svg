<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" role="img" aria-label="hilang">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8fb"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#dde5ee"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="878" height="258" rx="16" fill="url(#bg)" stroke="#d0d7de" stroke-width="2"/>
  <rect x="1" y="1" width="878" height="258" rx="16" fill="url(#dots)" opacity="0.6"/>
  <rect x="0" y="-40" width="880" height="34" fill="#0e9f6e" opacity="0.045">
    <animate attributeName="y" values="-40;280" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g stroke="#0e9f6e" stroke-width="3" fill="none" opacity="0.9" stroke-linecap="round">
    <path d="M 30 62 V 32 H 60"/>
    <path d="M 820 32 H 850 V 62"/>
    <path d="M 30 198 V 228 H 60"/>
    <path d="M 820 228 H 850 V 198"/>
  </g>
  <text x="70" y="58" font-size="14" fill="#0e9f6e" font-family="ui-monospace,Consolas,monospace" letter-spacing="3">// SECURITY · REVERSE · BUILD</text>
  <text x="66" y="132" font-size="62" font-weight="700" fill="#0e9f6e" filter="url(#soft)" opacity="0.3" font-family="Segoe UI,Helvetica,Arial,sans-serif">hilang<animate attributeName="opacity" values="0.15;0.35;0.15" dur="4s" repeatCount="indefinite"/></text>
  <text x="70" y="132" font-size="62" font-weight="700" fill="#111827" letter-spacing="2" font-family="Segoe UI,Helvetica,Arial,sans-serif">hilang</text>
  <rect x="278" y="82" width="24" height="56" fill="#0e9f6e"><animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/></rect>
  <text x="70" y="176" font-size="18" letter-spacing="1" fill="#374151" font-family="PingFang SC,Microsoft YaHei,sans-serif">攻防之间，代码之内。</text>
  <text x="70" y="214" font-size="13" fill="#9ca3af" font-family="ui-monospace,Consolas,monospace">$ whoami — security researcher &amp; builder</text>
</svg>
